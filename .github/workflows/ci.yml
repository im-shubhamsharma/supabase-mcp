name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: shellcheck + bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck bats

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck bats-core

      - name: ShellCheck
        run: shellcheck -s bash bin/supa-mcp install.sh hooks/session-start.sh tests/stubs/*

      - name: Run tests
        run: bats tests/
