name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: shellcheck + bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck bats-core

      - name: ShellCheck
        run: shellcheck -s bash bin/supa-mcp install.sh hooks/session-start.sh tests/stubs/*

      - name: Debug versions
        run: |
          bash --version | head -1
          jq --version
          bats --version

      - name: Run tests
        run: bats tests/

      - name: Debug single test with tracing
        if: always()
        run: |
          rm -f /tmp/supa_debug.log
          SUPA_MCP_DEBUG=/tmp/supa_debug.log bats tests/features.bats -f "switch --project resolves a project by name" || true
          echo "=== /tmp/supa_debug.log ==="
          cat /tmp/supa_debug.log || echo "(no debug file written)"
