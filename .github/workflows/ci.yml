name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: shellcheck + bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck bats

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shellcheck bats-core

      - name: ShellCheck
        run: shellcheck -s bash bin/supa-mcp install.sh hooks/session-start.sh tests/stubs/*

      - name: Debug versions
        run: |
          bash --version | head -1
          jq --version
          bats --version

      - name: Run tests
        run: bats tests/

      - name: Debug failing test (trace)
        if: always()
        run: |
          bash -x bin/supa-mcp account add company --token TOKEN_company --force 2>&1 | tail -5 || true
          echo "---setup---"
          export SUPA_MCP_CONFIG_DIR="$(mktemp -d)"
          export SUPA_MCP_TEST_KC="$(mktemp -d)"
          export SUPA_MCP_KEYCHAIN=security
          export PATH="$PWD/tests/stubs:$PATH"
          bin/supa-mcp account add company --token TOKEN_company --force
          mkdir -p /tmp/dbgwork && cd /tmp/dbgwork
          bin/supa-mcp link --account company --project-ref refC1 --json
          echo "---switch with trace---"
          bash -x "$GITHUB_WORKSPACE/bin/supa-mcp" switch --project company-staging --json 2>&1 | tail -80
